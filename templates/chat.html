<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Sidebar for Online Users -->
        <div class="left-sidebar">
            <h2>Welcome, {{ username }}</h2>
            <h3>Online Users</h3>
            <ul id="user-list">
                <!-- Online users will be listed here -->
            </ul>
        </div>

        <!-- Right Section for Chat -->
        <div class="right-section">
            <h3>Chatting with: <span id="selected-user">No one</span></h3>
            <div id="messages">
                <!-- Messages will be displayed here -->
            </div>
            <div class="input-container">
                <input type="text" id="message-input" placeholder="Type your message" />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        const username = "{{ username }}";
        const socket = io.connect('http://' + document.domain + ':' + location.port, {
            query: { username: username }
        });

        let selectedUser = null;
        let userMessages = {};  // Store messages for each user
        let unreadMessages = {}; // Track unread messages for each user

        // Listen for the user list
        socket.on('user_list', function(users) {
            const userList = document.getElementById('user-list');

            // Clear previous user list
            userList.innerHTML = '';

            users.forEach(function(user) {
                if (user !== username) {
                    const li = document.createElement('li');
                    li.textContent = user;

                    // Create a badge for unread messages
                    const badge = document.createElement('span');
                    badge.classList.add('badge');
                    li.appendChild(badge);

                    li.onclick = function() {
                        openChat(user);
                    };
                    userList.appendChild(li);
                }
            });
        });

        // Update the badge with unread message count
        function updateBadge(user) {
            const userListItems = document.querySelectorAll('#user-list li');
            const userItem = [...userListItems].find(item => item.textContent.startsWith(user));

            if (userItem) {
                const badge = userItem.querySelector('.badge');
                const unreadCount = unreadMessages[user] || 0;

                // Show count, or "5+" if unread count is more than 5
                if (unreadCount > 5) {
                    badge.textContent = '5+';
                } else {
                    badge.textContent = unreadCount > 0 ? unreadCount : '';
                }
            }
        }

        // Open chat with the selected user
        function openChat(user) {
            selectedUser = user;
            const title = document.getElementById('selected-user');
            title.textContent = user;

            // Clear previous messages
            const messageDiv = document.getElementById('messages');
            messageDiv.innerHTML = '';

            // Show the stored messages for the selected user
            if (userMessages[user]) {
                userMessages[user].forEach(function(msg) {
                    const message = document.createElement('div');
                    message.classList.add('message', msg.sender === username ? 'you' : 'other');
                    message.textContent = `${msg.sender}: ${msg.message}`;
                    messageDiv.appendChild(message);
                });

                // Mark messages as read
                unreadMessages[user] = 0;
                updateBadge(user); // Update badge after reading the messages
            }

            // Highlight the selected user in the list
            const userListItems = document.querySelectorAll('#user-list li');
            userListItems.forEach(item => item.classList.remove('active'));
            const selectedItem = [...userListItems].find(item => item.textContent.startsWith(user));
            if (selectedItem) {
                selectedItem.classList.add('active');
            }
        }

        // Listen for incoming messages
        socket.on('receive_message', function(data) {
            const messageDiv = document.getElementById('messages');

            // Only display the message if a user is selected
            if (selectedUser) {
                // If the current chat is with the recipient or sender, show the message
                if (selectedUser === data.sender || selectedUser === data.recipient) {
                    const message = document.createElement('div');
                    message.classList.add('message', data.sender === username ? 'you' : 'other');
                    message.textContent = `${data.sender}: ${data.message}`;
                    messageDiv.appendChild(message);
                    messageDiv.scrollTop = messageDiv.scrollHeight; // Scroll to the latest message
                }
            }

            // Save the message for later viewing when switching back
            if (!userMessages[data.sender]) {
                userMessages[data.sender] = [];
            }
            if (!userMessages[data.recipient]) {
                userMessages[data.recipient] = [];
            }

            userMessages[data.sender].push({ sender: data.sender, message: data.message });
            userMessages[data.recipient].push({ sender: data.sender, message: data.message });

            // Increment unread messages for the recipient
            if (data.recipient !== username) {
                if (!unreadMessages[data.recipient]) {
                    unreadMessages[data.recipient] = 0;
                }
                unreadMessages[data.recipient]++;
                updateBadge(data.recipient); // Update the badge
            }

            // If the message is for the current user, update the unread count
            if (data.sender !== username && selectedUser !== data.sender) {
                if (!unreadMessages[data.sender]) {
                    unreadMessages[data.sender] = 0;
                }
                unreadMessages[data.sender]++;
                updateBadge(data.sender); // Update the badge
            }
        });

        // Send message to the selected user
        function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value;

            if (message.trim() && selectedUser) {
                socket.emit('send_message', {
                    sender: username,
                    recipient: selectedUser,
                    message: message
                });

                // Display the user's message immediately in their chat
                const messageDiv = document.getElementById('messages');
                const userMessage = document.createElement('div');
                userMessage.classList.add('message', 'you');
                userMessage.textContent = `You: ${message}`;
                messageDiv.appendChild(userMessage);

                // Save the sent message for later viewing
                if (!userMessages[selectedUser]) {
                    userMessages[selectedUser] = [];
                }
                userMessages[selectedUser].push({ sender: username, message: message });

                messageInput.value = ''; // Clear input after sending
                messageDiv.scrollTop = messageDiv.scrollHeight; // Scroll to the latest message

                // Reset unread message count
                unreadMessages[selectedUser] = 0;
                updateBadge(selectedUser); // Update badge after sending
            }
        }

        // Listen for "Enter" key press to send the message
        const messageInput = document.getElementById('message-input');
        messageInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent default Enter behavior (new line or form submission)
                sendMessage();  // Call sendMessage function to send the message
            }
        });
    </script>
</body>
</html>
