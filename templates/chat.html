<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.min.js"></script>
    <style>

/* General Layout */
body {
    background-color: #2f3136;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
}

/* Container for the chat */
.container {
    display: flex;
    flex-direction: row;
    flex-grow: 1;
}

/* Left Sidebar (Online Users) */
.left-sidebar {
    width: 250px;
    background-color: #36393f;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 15px;
    height: 100vh;
    overflow-y: auto;
}

h2 {
    text-align: center;
    color: #7289da;
    margin: 0;
}

h3 {
    color: #7289da;
    margin: 0;
    text-align: center;
}

#user-list {
    list-style-type: none;
    padding: 0;
    margin: 0;
    text-align: center;
}

li {
    cursor: pointer;
    padding: 5px;
    margin: 5px 0;
    transition: background-color 0.3s;
}

li:hover {
    background-color: #4e5156;
}

.active {
    background-color: #5a6e98;
}

/* Right Section for Chat */
.right-section {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    background-color: #2f3136;
    position: relative;
}

/* Messages Section */
#messages {
    background-color: #2f3136;
    overflow-y: auto;
    padding: 10px;
    border-radius: 5px;
    width: 100%;
    max-height: 400px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column-reverse;  /* Ensures new messages appear at the bottom */
    gap: 2px;
}

/* Message Style */
.message {
    padding: 6px;
    font-size: 14px;
    line-height: 1.4;
    max-width: 100%;
    margin: 0;
    word-wrap: break-word;
}

.message.you {
    color: white;
    text-align: left;
}

.message.other {
    color: #7289da;
    text-align: left;
}

/* Pin the input and button to the bottom */
.input-container {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    background-color: #2f3136;
    z-index: 1;
}

input[type="text"] {
    flex-grow: 1;
    background-color: #40444b;
    color: white;
    padding: 10px;
    border-radius: 5px;
    border: none;
    font-size: 14px;
    box-sizing: border-box;
    margin-right: 10px;
}

button {
    background-color: #7289da;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    box-sizing: border-box;
}

button:hover {
    background-color: #5a6e98;
}


    </style>
</head>
<body>
    <div class="container">
        <!-- Left Sidebar for Online Users -->
        <div class="left-sidebar">
            <h2>Welcome, {{ username }}</h2>
            <h3>Online Users</h3>
            <ul id="user-list">
                <!-- Online users will be listed here -->
            </ul>
        </div>

        <!-- Right Section for Chat -->
        <div class="right-section">
            <h3>Chat with:</h3>
            <div id="messages">
                <!-- Messages will be displayed here -->
            </div>
            <div class="input-container">
                <input type="text" id="message-input" placeholder="Type your message" />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const username = "{{ username }}";
        const socket = io.connect('http://' + document.domain + ':' + location.port, {
            query: { username: username }
        });

        let selectedUser = null;

        // Listen for the user list
        socket.on('user_list', function(users) {
            const userList = document.getElementById('user-list');

            // Clear previous user list
            userList.innerHTML = '';

            users.forEach(function(user) {
                if (user !== username) {
                    const li = document.createElement('li');
                    li.textContent = user;
                    li.onclick = function() {
                        openChat(user);
                    };
                    userList.appendChild(li);
                }
            });
        });

        // Open chat with the selected user
        function openChat(user) {
            selectedUser = user;
            const messageDiv = document.getElementById('messages');
            messageDiv.innerHTML = ''; // Clear current messages
            const title = document.querySelector('h3');
            title.textContent = `Chat with ${user}`;

            // Highlight the selected user
            const userListItems = document.querySelectorAll('#user-list li');
            userListItems.forEach(item => item.classList.remove('active'));
            const selectedItem = [...userListItems].find(item => item.textContent === user);
            if (selectedItem) {
                selectedItem.classList.add('active');
            }
        }

        // Listen for incoming messages
        socket.on('receive_message', function(data) {
            if (data.sender === selectedUser || data.recipient === selectedUser) {
                const messageDiv = document.getElementById('messages');
                const message = document.createElement('div');
                message.classList.add('message', data.sender === username ? 'you' : 'other');
                message.textContent = `${data.sender}: ${data.message}`;
                messageDiv.appendChild(message);
                messageDiv.scrollTop = messageDiv.scrollHeight; // Scroll to the latest message
            }
        });

        // Send message to the selected user
        function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value;

            if (message.trim() && selectedUser) {
                socket.emit('send_message', {
                    sender: username,
                    recipient: selectedUser,
                    message: message
                });

                // Display the user's message immediately
                const messageDiv = document.getElementById('messages');
                const userMessage = document.createElement('div');
                userMessage.classList.add('message', 'you');
                userMessage.textContent = `You: ${message}`;
                messageDiv.appendChild(userMessage);

                messageInput.value = ''; // Clear input after sending
                messageDiv.scrollTop = messageDiv.scrollHeight; // Scroll to the latest message
            }
        }
    </script>
</body>
</html>
