<!-- Main Chat Section -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.min.js"></script>
<script>

// Add click event listener to the compiler toggle button
document.querySelector('.compiler-toggle').addEventListener('click', function() {
    // You can change this URL to the actual path where your compiler is located
    window.location.href = '/compiler';

    // If you need to redirect to different compiler types based on context
    // or if you want to add a parameter to the URL, you can use:
    // window.location.href = '/compiler?type=html'; // for HTML compiler
    // window.location.href = '/compiler?type=python'; // for Python compiler
});



// Toggle sidebar function
function toggleSidebar() {
    const sidebar = document.getElementById('rightSidebar');
    const overlay = document.getElementById('overlay');

    if (sidebar.classList.contains('visible')) {
        closeSidebar();
    } else {
        sidebar.classList.add('visible');
        overlay.style.display = 'block';
    }
}

// Close sidebar function
function closeSidebar() {
    const sidebar = document.getElementById('rightSidebar');
    const overlay = document.getElementById('overlay');

    sidebar.classList.remove('visible');
    overlay.style.display = 'none';
}

// Toggle the search bar visibility
function toggleSearchBar() {
    const searchBar = document.getElementById('searchBar');
    const searchInput = document.getElementById('messageSearchInput');
    const searchButton = document.getElementById('searchToggleButton');
    const clearButton = document.getElementById('clearSearchButton');

    if (searchBar.classList.contains('active')) {
        // Collapse the search bar
        searchBar.classList.remove('active');
        setTimeout(() => { searchBar.style.display = 'none'; }, 300);
        if (searchInput.value.trim()) {
            // Only clear and reload if a search was performed
            clearMessageSearch();
        } else {
            // Reset UI without reloading messages
            searchInput.value = '';
            clearButton.style.display = 'none';
        }
        searchButton.innerHTML = '<i class="fas fa-search"></i>';
    } else {
        // Expand the search bar
        searchBar.style.display = 'flex';
        setTimeout(() => { searchBar.classList.add('active'); }, 10);
        searchInput.focus();
        searchButton.innerHTML = '<i class="fas fa-times"></i>';
    }
}

// Clear the search and restore the full chat
function clearMessageSearch() {
    const searchInput = document.getElementById('messageSearchInput');
    const clearButton = document.getElementById('clearSearchButton');
    const searchBar = document.getElementById('searchBar');
    const searchButton = document.getElementById('searchToggleButton');

    searchInput.value = '';
    clearButton.style.display = 'none';
    searchBar.classList.remove('active');
    setTimeout(() => { searchBar.style.display = 'none'; }, 300);
    searchButton.innerHTML = '<i class="fas fa-search"></i>';

    if (selectedUser) {
        // Reload history to clear search results
        socket.emit('get_history', {sender: username, recipient: selectedUser});
    } else {
        document.getElementById('messages').innerHTML = '';
    }
}

function searchMessages() {
    const query = document.getElementById('messageSearchInput').value.trim();
    const clearButton = document.getElementById('clearSearchButton');
    clearButton.style.display = query ? 'block' : 'none';

    if (!selectedUser) {
        document.getElementById('messages').innerHTML = '';
        return;
    }

    if (!query) {
        socket.emit('get_history', {sender: username, recipient: selectedUser});
        return;
    }

    socket.emit('search_messages', {
        sender: username,
        recipient: selectedUser,
        query: query
    });
}

const username = "{{ username }}";
const socket = io.connect(location.origin, {query: {username}});
let selectedUser = null;
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
const messageHistory = {};
const unreadMessages = {};

// Utility Functions
function getRecipientFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('recipient') || '';
}

function formatTimestamp(date) {
    return date.toLocaleString('en-GB', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: true
    }).replace(',', '');
}

function updateBadge(user) {
    const userListItems = document.querySelectorAll('#user-list li');
    const userItem = [...userListItems].find(item => item.textContent.trim().startsWith(user));
    if (userItem) {
        const badge = userItem.querySelector('.badge') || document.createElement('span');
        badge.className = 'badge';
        const unreadCount = unreadMessages[user] || 0;
        badge.textContent = unreadCount > 5 ? '5+' : unreadCount;
        badge.style.display = unreadCount > 0 ? 'inline-block' : 'none';
        if (!userItem.contains(badge)) userItem.appendChild(badge);
    }
}

// Friend Request Functions
function updateRequestCount() {
    const friendRequests = document.getElementById('friendRequests');
    const requestCount = document.getElementById('request-count');
    const noRequests = document.getElementById('no-requests');
    const count = friendRequests.children.length;

    requestCount.textContent = count;
    requestCount.style.display = count > 0 ? 'inline-block' : 'none';
    noRequests.style.display = count === 0 ? 'block' : 'none';

    // Update sidebar toggle button badge
    updateSidebarBadge(count);
}

// Function to update the sidebar toggle button badge
function updateSidebarBadge(count) {
    const sidebarToggle = document.querySelector('.sidebar-toggle');
    let badge = sidebarToggle.querySelector('.sidebar-badge');

    if (!badge && count > 0) {
        badge = document.createElement('span');
        badge.className = 'sidebar-badge';
        badge.style.position = 'absolute';
        badge.style.top = '-5px';
        badge.style.right = '-5px';
        badge.style.backgroundColor = '#ff4d4d';
        badge.style.color = 'white';
        badge.style.borderRadius = '50%';
        badge.style.width = '18px';
        badge.style.height = '18px';
        badge.style.fontSize = '12px';
        badge.style.display = 'flex';
        badge.style.alignItems = 'center';
        badge.style.justifyContent = 'center';
        sidebarToggle.style.position = 'relative';
        sidebarToggle.appendChild(badge);
    } else if (badge) {
        if (count > 0) {
            badge.textContent = count > 5 ? '5+' : count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }
}

function loadFriendRequests() {
    fetch('/get_friend_requests', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `username=${encodeURIComponent(username)}`
    })
        .then(response => response.json())
        .then(data => {
            const friendRequests = document.getElementById('friendRequests');
            friendRequests.innerHTML = ''; // Clear existing
            data.requests.forEach(sender => {
                addFriendRequest(sender);
            });
            updateRequestCount();
        })
        .catch(error => {
            console.error('Error loading friend requests:', error);
        });
}

function searchUsers() {
    const query = document.getElementById('searchInput').value.trim();
    const searchResults = document.getElementById('searchResults');
    searchResults.innerHTML = '';

    if (!query) return;

    fetch('/search_users', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `query=${encodeURIComponent(query)}`
    })
        .then(response => response.json())
        .then(data => {
            data.users.forEach(user => {
                if (user !== username) {
                    const li = document.createElement('li');
                    li.textContent = user;
                    const button = document.createElement('button');
                    button.innerHTML = '<i class="fas fa-user-plus"></i>';
                    button.onclick = () => sendFriendRequest(user);
                    li.appendChild(button);
                    searchResults.appendChild(li);
                }
            });
        })
        .catch(error => {
            console.error('Error searching users:', error);
            alert('Error searching users.');
        });
}

function sendFriendRequest(recipient) {
    fetch('/send_friend_request', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `sender=${encodeURIComponent(username)}&recipient=${encodeURIComponent(recipient)}`
    })
        .then(response => response.json())
        .then(data => {
            alert(data.message || data.error);
            if (data.message) {
                document.getElementById('searchInput').value = '';
                document.getElementById('searchResults').innerHTML = '';
            }
        })
        .catch(error => {
            console.error('Error sending friend request:', error);
            alert('Error sending friend request.');
        });
}

function acceptFriendRequest(sender) {
    fetch('/accept_friend_request', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `username=${encodeURIComponent(username)}&sender=${encodeURIComponent(sender)}`
    })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
            // Remove from UI
            const requestLi = [...document.querySelectorAll('#friendRequests li')]
                .find(li => li.querySelector('.request-user').textContent === sender);
            if (requestLi) requestLi.remove();
            updateRequestCount();
            // Add to friends list
            const userList = document.getElementById('user-list');
            const li = document.createElement('li');
            li.textContent = sender;
            li.onclick = () => openChat(sender);
            userList.appendChild(li);
        })
        .catch(error => {
            console.error('Error accepting friend request:', error);
            alert('Error accepting friend request.');
        });
}

function rejectFriendRequest(sender) {
    fetch('/reject_friend_request', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `username=${encodeURIComponent(username)}&sender=${encodeURIComponent(sender)}`
    })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
            const requestLi = [...document.querySelectorAll('#friendRequests li')]
                .find(li => li.querySelector('.request-user').textContent === sender);
            if (requestLi) requestLi.remove();
            updateRequestCount();
        })
        .catch(error => {
            console.error('Error rejecting friend request:', error);
            alert('Error rejecting friend request.');
        });
}

// Chat Functions
function openChat(user) {
    fetch(`/chat_history/${username}/${user}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert('You can only chat with friends.');
                return;
            }
            selectedUser = user;
            const messages = document.getElementById('messages');
            messages.innerHTML = '';
            document.getElementById('input-container').style.display = 'flex';

            const userListItems = document.querySelectorAll('#user-list li');
            userListItems.forEach(item => item.classList.remove('active', 'selected'));
            const activeUser = [...userListItems].find(item => item.textContent.trim().startsWith(user));
            if (activeUser) activeUser.classList.add('active', 'selected');

            unreadMessages[user] = 0;
            updateBadge(user);
            window.history.pushState({}, '', `/chat/${username}?recipient=${user}`);
            socket.emit('get_history', {sender: username, recipient: user});
        })
        .catch(error => {
            console.error('Error checking friendship:', error);
            alert('You can only chat with friends.');
        });
}

// Helper function to infer file type from fileName (as a fallback)
function inferFileType(fileName) {
    const extension = fileName.split('.').pop().toLowerCase();
    const imageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'ico', 'tiff'];
    const videoExtensions = ['mp4', 'webm', 'mov', 'avi', 'wmv', 'flv', 'mkv', 'mpeg', 'mpg', '3gp'];
    if (imageExtensions.includes(extension)) return 'image/' + extension;
    if (videoExtensions.includes(extension)) return 'video/' + extension;
    return 'application/octet-stream';
}

// displayMessage function (unchanged, included for context)
function displayMessage({sender, text, audio, fileUrl, fileName, timestamp, fileType}) {
    if (sender !== username && sender !== selectedUser) return;
    const messages = document.getElementById('messages');
    const lastMessageBlock = messages.lastElementChild;
    const isSameSender = lastMessageBlock && lastMessageBlock.dataset.sender === sender;
    const timeGap = 2 * 60 * 1000;
    const msgTime = timestamp ? new Date(timestamp * 1000) : new Date();
    let messageBlock;
    let shouldCreateNewBlock = true;

    if (isSameSender) {
        const lastTimestamp = new Date(lastMessageBlock.dataset.timestamp || 0);
        if (msgTime - lastTimestamp < timeGap) {
            shouldCreateNewBlock = false;
            messageBlock = lastMessageBlock;
            messageBlock.dataset.timestamp = msgTime.toISOString();
        }
    }

    if (shouldCreateNewBlock) {
        messageBlock = document.createElement('div');
        messageBlock.className = 'message-block';
        messageBlock.dataset.sender = sender;
        messageBlock.dataset.timestamp = msgTime.toISOString();

        const senderInfo = document.createElement('div');
        senderInfo.className = 'message-sender-info';
        senderInfo.innerHTML = `<strong>${sender}</strong>`;
        const timestampSpan = document.createElement('span');
        timestampSpan.className = 'message-timestamp';
        timestampSpan.textContent = formatTimestamp(msgTime);
        senderInfo.appendChild(timestampSpan);

        messageBlock.appendChild(senderInfo);
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        messageBlock.appendChild(contentDiv);
        messages.appendChild(messageBlock);
    }

    const contentDiv = messageBlock.querySelector('.message-content');

    if (text) {
        const messageText = document.createElement('p');
        messageText.innerHTML = text;
        contentDiv.appendChild(messageText);
    }
    if (audio) {
        const audioElem = document.createElement('audio');
        audioElem.src = audio;
        audioElem.controls = true;
        contentDiv.appendChild(audioElem);
    }
    if (fileUrl && fileName) {
        const effectiveFileType = fileType || inferFileType(fileName);

        if (effectiveFileType.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = fileUrl;
            img.alt = fileName;
            img.style.maxWidth = '250px';
            img.style.cursor = 'pointer';
            img.onclick = () => expandMedia(fileUrl, fileName, effectiveFileType);
            contentDiv.appendChild(img);
        } else if (effectiveFileType.startsWith('video/')) {
            const video = document.createElement('video');
            video.src = fileUrl;
            video.controls = true;
            video.style.maxWidth = '300px';
            video.style.maxHeight = '200px';
            video.onclick = () => expandMedia(fileUrl, fileName, effectiveFileType);
            contentDiv.appendChild(video);
            const videoLink = document.createElement('a');
            videoLink.href = fileUrl;
            videoLink.target = '_blank';
            videoLink.textContent = 'Open video in new tab';
            videoLink.style.display = 'block';
            videoLink.style.marginTop = '5px';
            contentDiv.appendChild(videoLink);
        } else {
            const fileLink = document.createElement('a');
            fileLink.href = fileUrl;
            fileLink.download = fileName;
            let icon = '📄';
            if (effectiveFileType.includes('pdf')) icon = '📑';
            else if (effectiveFileType.includes('zip') || effectiveFileType.includes('rar')) icon = '🗜️';
            else if (effectiveFileType.includes('audio')) icon = '🔊';
            else if (effectiveFileType.includes('text')) icon = '📝';
            fileLink.innerHTML = `${icon} Download ${fileName}`;
            contentDiv.appendChild(fileLink);
        }
    }

    messages.scrollTop = messages.scrollHeight;
}


function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!selectedUser) {
        alert('Please select a friend to chat with.');
        return;
    }
    if (text) {
        fetch(`/chat_history/${username}/${selectedUser}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('You can only chat with friends.');
                    return;
                }
                const message = {sender: username, text: `You: ${text}`, timestamp: Date.now() / 1000};
                messageHistory[selectedUser] = messageHistory[selectedUser] || [];
                messageHistory[selectedUser].push(message);
                displayMessage(message);
                socket.emit('send_message', {sender: username, recipient: selectedUser, message: text});
                input.value = '';
            })
            .catch(error => {
                console.error('Error checking friendship:', error);
                alert('You can only chat with friends.');
            });
    }
}

function checkEnter(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        sendMessage();
        event.preventDefault();
    }
}

// First, modify the sendFile function to properly handle responses
function sendFile() {
    const fileInput = document.getElementById('file-input');
    const file = fileInput.files[0];
    if (!file || !selectedUser) {
        alert("Please select a friend and choose a file.");
        return;
    }

    fetch(`/chat_history/${username}/${selectedUser}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert('You can only send files to friends.');
                return;
            }

            const loadingId = `loading-${Date.now()}`;
            const messages = document.getElementById('messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'message-block';
            loadingDiv.dataset.sender = username;
            loadingDiv.dataset.timestamp = new Date().toISOString();
            const senderInfo = document.createElement('div');
            senderInfo.className = 'message-sender-info';
            senderInfo.innerHTML = `<strong>${username}</strong>`;
            const timestampSpan = document.createElement('span');
            timestampSpan.className = 'message-timestamp';
            timestampSpan.textContent = formatTimestamp(new Date());
            senderInfo.appendChild(timestampSpan);
            loadingDiv.appendChild(senderInfo);
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = `<p>Sending ${file.name}...</p><div class="loading-spinner"></div>`;
            contentDiv.innerHTML = `<p>Sending ${file.name}... <span id="progress-${loadingId}">0%</span></p><div class="loading-spinner"></div>`;
                socket.on('chunk_received', ({ chunk_index, total_chunks, file_name, loading_id: chunkLoadingId }) => {
                    if (chunkLoadingId === loadingId) {
                        const progress = Math.round(((chunk_index + 1) / total_chunks) * 100);
                        const progressSpan = document.getElementById(`progress-${loadingId}`);
                    if (progressSpan) progressSpan.textContent = `${progress}%`;
                    }
                });
            loadingDiv.appendChild(contentDiv);
            messages.appendChild(loadingDiv);
            messages.scrollTop = messages.scrollHeight;

            const chunkSize = 5 * 1024 * 1024; // 5MB chunks
            const totalChunks = Math.ceil(file.size / chunkSize);
            let chunkIndex = 0;

            function sendChunk() {
                if (chunkIndex >= totalChunks) return;
                const start = chunkIndex * chunkSize;
                const end = Math.min(start + chunkSize, file.size);
                const chunk = file.slice(start, end);
                const reader = new FileReader();
                reader.onload = () => {
                    const fileData = reader.result.split(',')[1];
                    socket.emit('send_file_chunk', {
                        sender: username,
                        recipient: selectedUser,
                        file_name: file.name,
                        file_type: file.type,
                        file_data: fileData,
                        chunk_index: chunkIndex,
                        total_chunks: totalChunks,
                        loading_id: loadingId
                    });
                    chunkIndex++;
                    sendChunk();
                };
                reader.readAsDataURL(chunk);
            }
            sendChunk();
        })
        .catch(error => {
            console.error('Error checking friendship:', error);
            alert('You can only send files to friends.');
        });
}

socket.on('chunk_received', ({ chunk_index, total_chunks, file_name, loading_id }) => {

function displayFileMessage(sender, fileName, fileData, fileType) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = sender === username ? 'message-sender' : 'message-receiver';
    const senderName = document.createElement('p');
    senderName.textContent = sender === username ? "You: " : sender;
    senderName.style.marginBottom = "5px";
    div.appendChild(senderName);

    if (fileType.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = `data:${fileType};base64,${fileData}`;
        img.style.width = '100px';
        img.style.cursor = 'pointer';
        img.onclick = () => expandMedia(img.src, fileName, fileType, fileData);
        div.appendChild(img);
    } else if (fileType.startsWith('video/')) {
        const video = document.createElement('video');
        video.src = `data:${fileType};base64,${fileData}`;
        video.controls = true;
        video.style.width = '150px';
        video.onclick = () => expandMedia(video.src, fileName, fileType, fileData);
        div.appendChild(video);
    } else {
        const fileLink = document.createElement('a');
        fileLink.href = `data:${fileType};base64,${fileData}`;
        fileLink.download = fileName;
        fileLink.textContent = `📎 Download ${fileName}`;
        div.appendChild(fileLink);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function expandMedia(src, fileName, fileType) {
    const expanded = document.createElement("div");
    expanded.classList.add("expanded");

    const closeBtn = document.createElement("span");
    closeBtn.classList.add("close-btn");
    closeBtn.innerHTML = "×";
    closeBtn.onclick = (e) => {
        e.stopPropagation(); // Prevent click from bubbling to expanded div
        expanded.remove();
    };
    expanded.appendChild(closeBtn);

    const mediaContainer = document.createElement("div");
    mediaContainer.classList.add("media-container");

    if (fileType.startsWith('image/')) {
        const img = document.createElement("img");
        img.src = src;
        img.classList.add("expanded-media");
        img.onload = () => {
            // Ensure layout adjusts after image loads
            mediaContainer.style.width = 'auto';
            mediaContainer.style.height = 'auto';
        };
        mediaContainer.appendChild(img);
    } else if (fileType.startsWith('video/')) {
        const video = document.createElement("video");
        video.src = src;
        video.controls = true;
        video.autoplay = true;
        video.classList.add("expanded-media");
        video.onloadedmetadata = () => {
            // Ensure layout adjusts after video metadata loads
            mediaContainer.style.width = 'auto';
            mediaContainer.style.height = 'auto';
        };
        mediaContainer.appendChild(video);
    }

    const downloadBtn = document.createElement("button");
    downloadBtn.classList.add("download-btn");
    downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download';
    downloadBtn.onclick = (e) => {
        e.stopPropagation(); // Prevent click from closing the expanded view
        const link = document.createElement('a');
        link.href = src;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };
    mediaContainer.appendChild(downloadBtn);

    expanded.appendChild(mediaContainer);
    document.body.appendChild(expanded);

    expanded.addEventListener("click", (e) => {
        if (e.target === expanded) expanded.remove();
    });

    document.addEventListener("keydown", function escClose(event) {
        if (event.key === "Escape") {
            expanded.remove();
            document.removeEventListener("keydown", escClose);
        }
    });
}

function downloadFile(fileName, fileType, fileData) {
    const link = document.createElement('a');
    link.href = `data:${fileType};base64,${fileData}`;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function toggleRecording() {
    if (!selectedUser) {
        alert("Please select a friend to chat with.");
        return;
    }
    fetch(`/chat_history/${username}/${selectedUser}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert('You can only send voice messages to friends.');
                return;
            }
            if (isRecording) stopRecording();
            else startRecording();
        })
        .catch(error => {
            console.error('Error checking friendship:', error);
            alert('You can only send voice messages to friends.');
        });
}

function startRecording() {
    navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = sendVoiceMessage;
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('record-btn').innerHTML = '<i class="fas fa-stop"></i>';
    });
}

function stopRecording() {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById('record-btn').innerHTML = '<i class="fas fa-microphone"></i>';
}

function sendVoiceMessage() {
    const audioBlob = new Blob(audioChunks);
    const reader = new FileReader();
    reader.onload = () => {
        const audioBase64 = reader.result.split(',')[1];
        const audioUrl = `data:audio/webm;base64,${audioBase64}`;
        const message = {sender: username, text: 'You: ', audio: audioUrl, timestamp: Date.now() / 1000};
        messageHistory[selectedUser] = messageHistory[selectedUser] || [];
        messageHistory[selectedUser].push(message);
        displayMessage(message);
        socket.emit('send_voice_message', {sender: username, recipient: selectedUser, audio_blob: audioBase64});
    };
    reader.readAsDataURL(audioBlob);
}

socket.on('receive_message', ({sender, message}) => {
    const msg = {sender, text: `${sender}: ${message}`, timestamp: Date.now() / 1000};
    messageHistory[sender] = messageHistory[sender] || [];
    messageHistory[sender].push(msg);
    if (sender === selectedUser) displayMessage(msg);
    else {
        unreadMessages[sender] = (unreadMessages[sender] || 0) + 1;
        updateBadge(sender);
    }
});

function addFriendRequest(sender) {
    const friendRequests = document.getElementById('friendRequests');
    // Avoid duplicates
    if ([...friendRequests.children].some(li => li.querySelector('.request-user')?.textContent === sender)) {
        return;
    }
    const li = document.createElement('li');
    li.innerHTML = `
        <span class="request-user">${sender}</span>
        <div class="request-actions">
            <button class="accept-btn" title="Accept request">
                <i class="fas fa-check"></i>
            </button>
            <button class="reject-btn" title="Reject request">
                <i class="fas fa-times"></i>
            </button>
        </div>
    `;
    li.querySelector('.accept-btn').onclick = () => acceptFriendRequest(sender);
    li.querySelector('.reject-btn').onclick = () => rejectFriendRequest(sender);
    friendRequests.appendChild(li);
    updateRequestCount();
}
